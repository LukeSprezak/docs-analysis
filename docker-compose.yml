name: docsanalysis

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: dev
    image: docsanalysis-api:latest
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - venv_data:/app/.venv
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      # Waited on even when KNOWLEDGE_GRAPH_PROVIDER=none: the repository is built lazily on
      # first use, so without this the failure would not be a clean startup error but a 500 on
      # whichever request happened to arrive during Neo4j's ~40s boot. The two databases start
      # in parallel, so the added wait is Neo4j's boot time, not the sum. If you never use the
      # graph and want the seconds back, put `graph` behind a compose profile.
      graph:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: ../docker/frontend/Dockerfile
      target: dev
    image: docsanalysis-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - api
    networks:
      - backend

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-docs_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-docs_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Graph store. Not yet wired into the application (no PERSISTENCE_PROVIDER=neo4j adapter
  # exists) — it is here so the contract suites in tests/contracts/ have a server to run
  # their `integration` parameters against. The browser UI is on :7474, Bolt on :7687.
  graph:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      # NEO4J_AUTH is user/password in one value; the username is fixed to `neo4j` on the
      # community edition.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      # The same secret again under a non-NEO4J_ name, for the healthcheck below. Neo4j 5 maps
      # every NEO4J_-prefixed variable onto a config setting and refuses to start on an
      # unrecognized one (strict validation), so a bare NEO4J_PASSWORD would break the server.
      - GRAPH_PASSWORD=${NEO4J_PASSWORD}
      # APOC ships the procedures langchain-neo4j relies on for graph writes.
      - NEO4J_PLUGINS=["apoc"]
      # Neo4j sizes the JVM heap from the host's total RAM by default, which is far more than
      # a dev box needs next to Postgres and the API.
      - NEO4J_server_memory_heap_max__size=512M
      - NEO4J_server_memory_pagecache_size=256M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - backend
    healthcheck:
      test:
        ["CMD-SHELL", "cypher-shell -u neo4j -p $${GRAPH_PASSWORD} 'RETURN 1' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Neo4j boots the JVM and the plugins before it accepts Bolt — slower to start than Postgres.
      start_period: 40s

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  venv_data:
