[project]
name = "docsanalysis"
version = "0.1.0"
description = "Analysis of documents using LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "google-generativeai>=0.8.0",
    "gunicorn>=23.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.1.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.0.1",
    "faiss-cpu>=1.8.0",
    "pymupdf4llm>=0.0.17",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "langchain-postgres>=0.0.12",
    "cohere>=7.0.3",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "slowapi>=0.1.9",
    "alembic>=1.18.4",
]

[project.optional-dependencies]
local-reranker = [
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=1.4.0",
    "httpx2>=2.7.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# ASYNC230/240: The rules regarding blocking the event loop apply to production code — in tests,
# file system assertions (open/Path.exists) are acceptable and more readable than threads.
"tests/*" = ["S101", "S105", "S106", "ASYNC230", "ASYNC240"]
# The exception hierarchy uses a fixed, descriptive suffix `*Exception` (a standard
# Python convention, consistent throughout the API) — we deliberately do not enforce `*Error` (N818).
"app/shared/exceptions.py" = ["N818"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Warnings are errors, so a new one (especially a deprecation in our own code) fails the build
# instead of piling up in the summary. Below are the only exceptions — each one comes from a
# dependency we cannot fix from here, so it is silenced narrowly by message, never wholesale.
filterwarnings = [
    "error",
    # langchain-community is being sunset. FAISS has no official standalone package yet
    # (`langchain-faiss` on PyPI is an unrelated third-party upload, not a LangChain release),
    # so faiss_vectorstore_repo keeps this import until one ships.
    "ignore:`langchain-community` is being sunset:DeprecationWarning",
    # PyMuPDF's SWIG bindings on Python 3.12 — raised while importing the C extension.
    "ignore:builtin type Swig(PyPacked|PyObject) has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
disable_error_code = ["return-value"]
ignore_missing_imports = true
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
